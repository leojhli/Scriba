<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 480 320" width="480" height="320">
  <!-- Scriba Inu asleep: lying down, chin on paws, scroll set down beside it. Placeholder for the
       artist's scriba-sleeping.png (see docs/mascot/README.md). -->
  <defs>
    <clipPath id="head"><path d="M105 175C105 125 140 100 185 100C230 100 265 125 265 175C268 200 276 214 268 232C255 258 222 268 185 268C148 268 115 258 102 232C94 214 102 200 105 175Z"/></clipPath>
    <clipPath id="body"><path d="M222 186C272 140 382 138 422 172C452 198 456 262 432 288C410 306 330 306 250 300Z"/></clipPath>
  </defs>
  <g stroke="#1e1b19" stroke-linecap="round" stroke-linejoin="round">
    <!-- floor shadow -->
    <ellipse cx="250" cy="306" rx="218" ry="11" fill="#2b2420" fill-opacity=".08" stroke="none"/>

    <!-- tail, curled over the rump -->
    <path d="M404 184C388 142 418 110 452 122C482 134 478 182 444 190C420 195 408 174 422 162C432 154 446 160 442 172" fill="#ffa33c" stroke-width="5"/>
    <path d="M430 136C452 132 466 148 460 166" fill="none" stroke="#fff6ea" stroke-width="7"/>

    <!-- body -->
    <g clip-path="url(#body)">
      <rect x="200" y="120" width="280" height="200" fill="#ffa33c" stroke="none"/>
      <path d="M215 268C300 286 380 286 460 262V320H215Z" fill="#fff6ea" stroke="none"/>
      <path d="M300 160C340 150 390 154 418 176" fill="none" stroke="#ee9a33" stroke-width="10" opacity=".7"/>
    </g>
    <path d="M222 186C272 140 382 138 422 172C452 198 456 262 432 288C410 306 330 306 250 300" fill="none" stroke-width="5"/>
    <!-- back leg and hind paw -->
    <path d="M356 236C384 224 410 242 412 270" fill="none" stroke-width="4"/>
    <ellipse cx="398" cy="294" rx="28" ry="12" fill="#fff6ea" stroke-width="4.5"/>
    <path d="M392 290v8M404 290v8" fill="none" stroke-width="3"/>

    <!-- ears -->
    <path d="M114 150C106 106 116 72 132 56C152 64 174 88 184 106Z" fill="#ffa33c" stroke-width="5"/>
    <path d="M124 128C120 104 126 86 134 76C146 84 158 98 164 110Z" fill="#fdf4e4" stroke="none"/>
    <path d="M128 124C128 112 134 104 140 102C148 106 152 114 150 122Z" fill="#e6d5b4" stroke="none"/>
    <path d="M256 150C264 106 254 72 238 56C218 64 196 88 186 106Z" fill="#ffa33c" stroke-width="5"/>
    <path d="M246 128C250 104 244 86 236 76C224 84 212 98 206 110Z" fill="#fdf4e4" stroke="none"/>
    <path d="M242 124C242 112 236 104 230 102C222 106 218 114 220 122Z" fill="#e6d5b4" stroke="none"/>

    <!-- head -->
    <g clip-path="url(#head)">
      <rect x="90" y="90" width="190" height="190" fill="#ffa33c" stroke="none"/>
      <path d="M232 112C252 130 262 160 262 196" fill="none" stroke="#ee9a33" stroke-width="12" opacity=".8"/>
      <path d="M88 204C122 192 156 198 172 206C180 200 190 200 198 206C214 198 248 192 282 204V285H88Z" fill="#fff6ea" stroke="none"/>
      <path d="M120 256C150 266 220 266 250 256" fill="none" stroke="#e6d5b4" stroke-width="8"/>
    </g>
    <path d="M105 175C105 125 140 100 185 100C230 100 265 125 265 175C268 200 276 214 268 232C255 258 222 268 185 268C148 268 115 258 102 232C94 214 102 200 105 175Z" fill="none" stroke-width="5"/>

    <!-- brow dots -->
    <ellipse cx="156" cy="150" rx="7.5" ry="5.5" fill="#fff6ea" stroke="none" transform="rotate(-20 156 150)"/>
    <ellipse cx="214" cy="150" rx="7.5" ry="5.5" fill="#fff6ea" stroke="none" transform="rotate(20 214 150)"/>
    <!-- closed, sleepy eyes -->
    <path d="M134 184Q149 194 164 184" fill="none" stroke-width="5"/>
    <path d="M206 184Q221 194 236 184" fill="none" stroke-width="5"/>
    <!-- cheeks -->
    <ellipse cx="128" cy="212" rx="19" ry="10.5" fill="#ffb2a0" stroke="none"/>
    <ellipse cx="242" cy="212" rx="19" ry="10.5" fill="#ffb2a0" stroke="none"/>
    <!-- nose and mouth -->
    <path d="M174 202C174 196 196 196 196 202C196 210 189 214 185 215C181 214 174 210 174 202Z" fill="#231f1d" stroke-width="2"/>
    <path d="M185 215v5M173 223Q179 228 185 221Q191 228 197 223" fill="none" stroke-width="3.5"/>

    <!-- front paws under the chin -->
    <ellipse cx="150" cy="270" rx="32" ry="15" fill="#fff6ea" stroke-width="4.5"/>
    <ellipse cx="222" cy="272" rx="32" ry="15" fill="#fff6ea" stroke-width="4.5"/>
    <path d="M140 268v8M152 268v8M212 270v8M224 270v8" fill="none" stroke-width="3"/>

    <!-- the scroll, set down -->
    <g transform="rotate(-6 70 286)">
      <path d="M26 274H104V300H26C20 300 18 296 20 287C18 278 20 274 26 274Z" fill="#fdfdfb" stroke-width="4"/>
      <path d="M34 292H96" fill="none" stroke="#c9c9c6" stroke-width="4"/>
      <ellipse cx="104" cy="287" rx="8" ry="13" fill="#c9c9c6" stroke-width="4"/>
      <ellipse cx="104" cy="287" rx="3" ry="6" fill="none" stroke="#7d7d7a" stroke-width="2.5"/>
      <path d="M64 274V302C64 310 70 314 66 322" fill="none" stroke="#d6533a" stroke-width="6"/>
    </g>

    <!-- z z z -->
    <path d="M70 96H92L70 118H92" fill="none" stroke-width="4.5"/>
    <path d="M42 62H57L42 77H57" fill="none" stroke-width="3.5"/>
    <path d="M22 34H32L22 44H32" fill="none" stroke-width="3"/>
  </g>
</svg>
