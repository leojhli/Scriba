<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scriba</title>
<style>
  :root { --ink: #2b2420; --muted: #6f6158; --shiba: #ffa33c; --shiba-deep: #f08a1c; --ribbon: #d6533a;
    --hand: "Chalkboard SE", "Chalkboard", "Comic Neue", "Comic Sans MS", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 280px; padding: 16px 16px 14px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; color: var(--ink);
    background: radial-gradient(circle at 20% 0%, #fffaf1, #f6eddf 70%); }
  .head { display: flex; align-items: center; gap: 10px; }
  .head img { width: 46px; height: auto; transition: filter .2s, transform .2s; }
  body.off .head img { filter: grayscale(1) opacity(.6); transform: rotate(-6deg); }
  .name { font-family: var(--hand); font-weight: 700; font-size: 19px; }
  .tag { color: var(--muted); font-size: 11.5px; }

  /* The sketched switch */
  .row { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; padding: 10px 12px; position: relative;
    background: rgba(255,252,246,.75); border-radius: 14px 18px 13px 19px / 18px 13px 19px 14px; }
  .row::before { content: ""; position: absolute; inset: 0; border: 1.7px solid var(--ink); border-radius: inherit; filter: url(#sk1); pointer-events: none; }
  .row label { font-family: var(--hand); font-weight: 700; font-size: 14px; cursor: pointer; }
  #state { color: var(--shiba-deep); }
  body.off #state { color: var(--muted); }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 1; margin: 0; }
  .track { position: absolute; inset: 0; border-radius: 15px 12px 14px 13px; background: rgba(222,206,182,.7); transition: background .2s; }
  .track::before { content: ""; position: absolute; inset: 0; border: 1.6px solid var(--ink); border-radius: inherit; filter: url(#sk2); }
  .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fffaf1; border: 1.6px solid var(--ink);
    transition: transform .25s cubic-bezier(.3,1.45,.55,1); }
  input:checked ~ .track { background: repeating-linear-gradient(-55deg, rgba(255,163,60,.9) 0 2.5px, rgba(255,163,60,.5) 2.5px 6px); }
  input:checked ~ .knob { transform: translateX(20px); }
  input:focus-visible ~ .track { outline: 2px dashed var(--shiba-deep); outline-offset: 3px; }
  #hint { color: var(--muted); font-family: var(--hand); font-size: 12.5px; min-height: 3em; }

  .links { display: flex; gap: 8px; margin-top: 12px; }
  .links a { flex: 1; position: relative; text-align: center; text-decoration: none; color: var(--ink); font-family: var(--hand); font-weight: 700;
    padding: 7px 0; background: rgba(255,252,246,.6); border-radius: 16px 20px 15px 22px / 20px 15px 22px 16px; }
  .links a::before { content: ""; position: absolute; inset: 0; border: 1.6px solid var(--ink); border-radius: inherit; filter: url(#sk1); }
  .links a:hover { background: #fff; transform: rotate(-1deg); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="sk1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="sk2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="G" yChannelSelector="R"/></filter>
  </svg>
  <div class="head">
    <img src="assets/scriba-inu.png" alt="Scriba">
    <div><div class="name">Scriba</div><div class="tag">You just watch. I build your study program.</div></div>
  </div>
  <div class="row">
    <label for="toggle">Scriba is <span id="state">On</span></label>
    <span class="switch">
      <input type="checkbox" id="toggle" role="switch" aria-label="Turn Scriba on or off" checked>
      <span class="track"></span><span class="knob"></span>
    </span>
  </div>
  <p id="hint"></p>
  <div class="links">
    <a href="#" data-path="/deck">Your deck</a>
    <a href="#" data-path="/practice">Practice</a>
  </div>
  <script src="dist/popup.js"></script>
</body>
</html>
